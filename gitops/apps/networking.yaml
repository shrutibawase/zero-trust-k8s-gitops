apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: networking-cilium-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: zero-trust-k8s-gitops
    gitops.enterprise.io/layer: networking
spec:
  project: default
  source:
    repoURL: 'https://github.com/shrutibawase/zero-trust-k8s-gitops.git'
    targetRevision: HEAD
    path: networking/cilium
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: zero-trust-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: zero-trust-k8s-gitops
    gitops.enterprise.io/layer: governance
spec:
  project: default
  source:
    repoURL: 'https://github.com/shrutibawase/zero-trust-k8s-gitops.git'
    targetRevision: HEAD
    path: policies/kyverno
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

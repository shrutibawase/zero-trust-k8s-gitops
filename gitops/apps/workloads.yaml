apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-secure-microservice
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: zero-trust-k8s-gitops
    gitops.enterprise.io/layer: applications
spec:
  project: default
  source:
    repoURL: 'https://github.com/shrutibawase/zero-trust-k8s-gitops.git'
    targetRevision: HEAD
    path: charts/secure-microservice
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: zero-trust-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

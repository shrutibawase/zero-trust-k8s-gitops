apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Resource Tracking
  application.resourceTrackingMethod: "annotation"

  # Custom Health Checks for Zero-Trust Custom Resources
  resource.customizations.health.cilium.io_CiliumNetworkPolicy: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "eBPF policy active"
    return hs

  resource.customizations.health.kyverno.io_ClusterPolicy: |
    hs = {}
    if obj.status ~= nil and obj.status.ready == true then
      hs.status = "Healthy"
      hs.message = "Kyverno admission rule active"
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Policy initializing"
    return hs

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-cluster-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: zero-trust-k8s-gitops
    gitops.enterprise.io/tier: root-orchestrator
spec:
  project: default
  source:
    repoURL: 'https://github.com/shrutibawase/zero-trust-k8s-gitops.git'
    targetRevision: HEAD
    path: gitops/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

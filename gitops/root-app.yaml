apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-enterprise-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/shrutibawase/zero-trust-k8s-gitops.git'
    targetRevision: HEAD
    path: charts/secure-microservice
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: batch/v1
kind: Job
metadata:
  name: pre-sync-db-migration
  namespace: zero-trust-prod
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: zero-trust-k8s-gitops
    gitops.enterprise.io/hook: presync
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migration-hook
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-migration
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - |
              echo "🚀 [PreSync Hook] Checking database availability..."
              echo "✅ [PreSync Hook] Executing database schema migrations..."
              echo "🎉 [PreSync Hook] Migration successfully applied at $(date -u)"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

# Environment Overrides: Production (Zero-Trust Hardened)
replicaCount: 5

config:
  environment: "production"
  logLevel: "WARN"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: api.enterprise.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: prod-api-tls-cert
      hosts:
        - api.enterprise.com

quota:
  enabled: true
  requests:
    cpu: "16"
    memory: "32Gi"
  limits:
    cpu: "32"
    memory: "64Gi"
  pods: "50"

limitRange:
  enabled: true
  default:
    cpu: "1000m"
    memory: "1Gi"
  defaultRequest:
    cpu: "250m"
    memory: "256Mi"
  max:
    cpu: "4"
    memory: "4Gi"
  min:
    cpu: "100m"
    memory: "128Mi"

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secure-microservice.fullname" . }}-secrets
  labels:
    {{- include "secure-microservice.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ .Values.secrets.apiKey | default "mock-zero-trust-token-secret" | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | default "P@ssw0rdSecureProd123!" | quote }}

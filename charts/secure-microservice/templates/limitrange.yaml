{{- if .Values.limitRange.enabled -}}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "secure-microservice.fullname" . }}-limitrange
  labels:
    {{- include "secure-microservice.labels" . | nindent 4 }}
spec:
  limits:
    - default:
        cpu: {{ .Values.limitRange.default.cpu | default "500m" | quote }}
        memory: {{ .Values.limitRange.default.memory | default "512Mi" | quote }}
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequest.cpu | default "100m" | quote }}
        memory: {{ .Values.limitRange.defaultRequest.memory | default "128Mi" | quote }}
      max:
        cpu: {{ .Values.limitRange.max.cpu | default "2" | quote }}
        memory: {{ .Values.limitRange.max.memory | default "2Gi" | quote }}
      min:
        cpu: {{ .Values.limitRange.min.cpu | default "50m" | quote }}
        memory: {{ .Values.limitRange.min.memory | default "64Mi" | quote }}
      type: Container
{{- end }}

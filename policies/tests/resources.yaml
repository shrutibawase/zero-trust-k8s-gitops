apiVersion: v1
kind: Pod
metadata:
  name: compliant-secure-pod
  namespace: zero-trust-prod
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: microservice
      image: ghcr.io/shrutibawase/secure-microservice:v1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-root-pod
  namespace: zero-trust-prod
spec:
  containers:
    - name: rogue-container
      image: evil-registry.io/backdoor:latest
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0

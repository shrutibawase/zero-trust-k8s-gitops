name: zero-trust-kyverno-test-suite
policies:
  - ../kyverno/disallow-privileged-containers.yaml
  - ../kyverno/require-ro-rootfs.yaml
  - ../kyverno/disallow-latest-and-untrusted-registries.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-privileged-and-capabilities
    rule: disallow-privileged-containers
    resource: compliant-secure-pod
    kind: Pod
    result: pass

  - policy: disallow-privileged-and-capabilities
    rule: disallow-privileged-containers
    resource: non-compliant-root-pod
    kind: Pod
    result: fail

  - policy: require-ro-rootfs-and-non-root
    rule: check-readonly-root-filesystem
    resource: compliant-secure-pod
    kind: Pod
    result: pass

  - policy: disallow-latest-and-untrusted-registries
    rule: validate-image-tag-not-latest
    resource: non-compliant-root-pod
    kind: Pod
    result: fail

  - policy: disallow-latest-and-untrusted-registries
    rule: whitelist-trusted-registries
    resource: non-compliant-root-pod
    kind: Pod
    result: fail

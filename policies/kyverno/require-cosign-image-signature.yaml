apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-image-cosign-signature
  annotations:
    policies.kyverno.io/title: Verify Cosign Container Signatures (SLSA L3)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: Refuses deployment of any container image not signed by the authorized GitHub Actions workflow.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/shrutibawase/*"
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/shrutibawase/*"

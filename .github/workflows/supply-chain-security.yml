name: "SLSA Level 3 Supply Chain Security & Container Signing"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write       # Required for Sigstore Cosign keyless OIDC token generation
  security-events: write # Required for GitHub Advanced Security SARIF upload

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-and-secrets:
    name: "Shift-Left Static & Secret Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Leaked Secrets (GitLeaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov Static Code Analysis for Helm & K8s
        uses: bridgecrewio/checkov-action@master
        with:
          framework: kubernetes,helm
          output_format: cli
          soft_fail: false

  build-scan-and-sign:
    name: "Build, Trivy Scan, SBOM & Cosign Signing"
    runs-on: ubuntu-latest
    needs: [sast-and-secrets]
    if: github.event_name != 'pull_request'
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install Syft CLI
        uses: anchore/sbom-action/download-syft@v0.16.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}

      - name: Build and Push Secure OCI Container Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Software Bill of Materials (SBOM) with Syft
        run: |
          echo "Generating SPDX 2.3 and CycloneDX 1.5 SBOMs for image..."
          syft "ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}" \
            -c .syft.yaml \
            -o spdx-json=sbom-spdx.json \
            -o cyclonedx-json=sbom-cyclonedx.json
          
          echo "Verifying generated SBOM artifacts..."
          test -s sbom-spdx.json || (echo "Error: SPDX SBOM was not generated" && exit 1)
          test -s sbom-cyclonedx.json || (echo "Error: CycloneDX SBOM was not generated" && exit 1)

      - name: Upload SBOM Compliance Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts-${{ github.sha }}
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 90

      - name: Run Trivy Vulnerability Scanner on Container Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy Security Findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container"

      - name: Run Grype Scanner against SPDX SBOM
        uses: anchore/scan-action@v3
        with:
          sbom: "sbom-spdx.json"
          config: ".grype.yaml"
          fail-build: true
          severity-cutoff: "high"
          output-format: "sarif"

      - name: Sign Container Image (Sigstore Keyless OIDC)
        env:
          IMAGE_URI: ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "Signing image digest: $IMAGE_URI"
          cosign sign --yes "$IMAGE_URI"
